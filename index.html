<script type="text/plain" id="sql7">-- ============ Solar Stack v7: channel partners (sub-vendors), notifications, staff/partner management ============
-- UPGRADE script for an EXISTING Solar Stack database (adds channel partners, notifications, package gating).
-- For a brand-new project use setup_full_new_database.sql instead. Safe to run more than once.

alter table ss_profiles add column if not exists ptype text;
alter table ss_plans add column if not exists max_partners int default 0;   -- 0 = Channel Partners NOT included in the package

create or replace function is_partner() returns boolean language sql security definer stable set search_path=public as $$select exists(select 1 from ss_profiles where id=auth.uid() and ptype='partner')$$;
grant execute on function is_partner() to authenticated;

-- allow vendor-side RPCs to change parent/ptype/active/business of their own child accounts
create or replace function ss_guard() returns trigger language plpgsql security definer set search_path=public as $$begin
 if not is_owner() then
  new.role=old.role;new.plan_id=old.plan_id;new.plan_name=old.plan_name;new.plan_expiry=old.plan_expiry;
  if coalesce(current_setting('ss.staff',true),'')<>'1' then new.parent=old.parent;new.ptype=old.ptype;new.active=old.active;end if;
 end if;return new;end$$;

create or replace function ss_add_partner(em text, biz jsonb) returns void language plpgsql security definer set search_path=public as $$
declare mx int; exp date; cnt int;
begin
  select coalesce(p.max_partners,0), u.plan_expiry into mx, exp
    from ss_profiles u left join ss_plans p on p.id=u.plan_id where u.id=auth.uid();
  if coalesce(mx,0)<=0 then raise exception 'Your package does not include Channel Partners. Please upgrade your package.'; end if;
  if exp is null or exp<current_date then raise exception 'Your package has expired. Please renew to add channel partners.'; end if;
  select count(*) into cnt from ss_profiles where parent=auth.uid() and ptype='partner';
  if cnt>=mx then raise exception 'Your package allows up to % channel partner(s). Please upgrade your package to add more.', mx; end if;
  perform set_config('ss.staff','1',true);
  update ss_profiles set parent=auth.uid(), ptype='partner', business=coalesce(biz,'{}'::jsonb)
   where lower(email)=lower(em) and parent is null and role='user'
     and created_at>now()-interval '10 minutes' and id<>auth.uid();
  if not found then raise exception 'Could not link the partner account. The email may already be registered.'; end if;
end$$;

create or replace function ss_child_update(cid uuid, act boolean, biz jsonb) returns void language plpgsql security definer set search_path=public as $$begin
 if not exists(select 1 from ss_profiles where id=cid and parent=auth.uid()) then raise exception 'Not allowed'; end if;
 perform set_config('ss.staff','1',true);
 update ss_profiles set active=coalesce(act,active),business=coalesce(biz,business) where id=cid;
end$$;

create or replace function ss_child_delete(cid uuid) returns void language plpgsql security definer set search_path=public as $$begin
 if not exists(select 1 from ss_profiles where id=cid and parent=auth.uid()) then raise exception 'Not allowed'; end if;
 delete from auth.users where id=cid;
end$$;
grant execute on function ss_add_partner(text,jsonb) to authenticated;
grant execute on function ss_child_update(uuid,boolean,jsonb) to authenticated;
grant execute on function ss_child_delete(uuid) to authenticated;

-- a partner must NOT see the vendor's private records / documents
drop policy if exists rc_a on ss_records;
create policy rc_a on ss_records for all using(auth.uid()=user_id or (user_id=my_parent() and not is_partner()) or is_owner()) with check(auth.uid()=user_id or (user_id=my_parent() and not is_partner()));
drop policy if exists docs_all on storage.objects;
create policy docs_all on storage.objects for all to authenticated using(bucket_id='ss-docs' and ((storage.foldername(name))[1]=auth.uid()::text or ((storage.foldername(name))[1]=my_parent()::text and not is_partner()))) with check(bucket_id='ss-docs' and ((storage.foldername(name))[1]=auth.uid()::text or ((storage.foldername(name))[1]=my_parent()::text and not is_partner())));
drop policy if exists tk_rd on storage.objects;
create policy tk_rd on storage.objects for select to authenticated using(bucket_id='ss-tickets' and ((storage.foldername(name))[1]=auth.uid()::text or ((storage.foldername(name))[1]=my_parent()::text and not is_partner())));
drop policy if exists tk_dl on storage.objects;
create policy tk_dl on storage.objects for delete to authenticated using(bucket_id='ss-tickets' and ((storage.foldername(name))[1]=auth.uid()::text or ((storage.foldername(name))[1]=my_parent()::text and not is_partner())));

-- partner records: leads (plead), projects (pproj), materials (pmat), transactions (ptxn)
create table if not exists ss_partner_records(id uuid primary key default gen_random_uuid(),vendor_id uuid not null,partner_id uuid not null,kind text not null,data jsonb not null default '{}',created_at timestamptz default now());
create index if not exists ss_pr_v on ss_partner_records(vendor_id,created_at desc);
create index if not exists ss_pr_p on ss_partner_records(partner_id,created_at desc);
alter table ss_partner_records enable row level security;
drop policy if exists spr_a on ss_partner_records;
create policy spr_a on ss_partner_records for all
 using(auth.uid()=vendor_id or (auth.uid()=partner_id and exists(select 1 from ss_profiles where id=auth.uid() and active)) or is_owner())
 with check((auth.uid()=vendor_id and exists(select 1 from ss_profiles c where c.id=partner_id and c.parent=auth.uid())) or (auth.uid()=partner_id and vendor_id=my_parent() and exists(select 1 from ss_profiles where id=auth.uid() and active)));

-- notifications
create table if not exists ss_notifications(id uuid primary key default gen_random_uuid(),user_id uuid not null,title text,body text,kind text,ref text,read boolean default false,n int default 1,created_at timestamptz default now());
create index if not exists ss_nt_u on ss_notifications(user_id,created_at desc);
alter table ss_notifications enable row level security;
drop policy if exists nt_s on ss_notifications; create policy nt_s on ss_notifications for select using(auth.uid()=user_id);
drop policy if exists nt_u on ss_notifications; create policy nt_u on ss_notifications for update using(auth.uid()=user_id) with check(auth.uid()=user_id);
drop policy if exists nt_d on ss_notifications; create policy nt_d on ss_notifications for delete using(auth.uid()=user_id);

create or replace function ss_notify(uid uuid,t text,b text,k text,r text) returns void language plpgsql security definer set search_path=public as $$
declare x uuid;
begin
 if uid is null then return; end if;
 select id into x from ss_notifications where user_id=uid and title=t and coalesce(ref,'')=coalesce(r,'') and not read and created_at>now()-interval '2 minutes' order by created_at desc limit 1;
 if x is not null then update ss_notifications set body=left(b,500),n=n+1,created_at=now() where id=x;
 else insert into ss_notifications(user_id,title,body,kind,ref) values(uid,left(t,160),left(b,500),k,r); end if;
end$$;
revoke all on function ss_notify(uuid,text,text,text,text) from public, anon, authenticated;

-- partner <-> vendor activity notifications
create or replace function ss_pr_notify() returns trigger language plpgsql security definer set search_path=public as $$
declare actor uuid:=auth.uid(); rw ss_partner_records; rcp uuid; an text; verb text; lbl text; nm text; msg text; d jsonb;
begin
 if tg_op='DELETE' then rw:=old; else rw:=new; end if;
 d:=rw.data;
 if tg_op='UPDATE' and old.data=new.data then return null; end if;
 if actor is null then return null; end if;
 if actor=rw.partner_id then rcp:=rw.vendor_id; select coalesce(nullif(business->>'name',''),email) into an from ss_profiles where id=actor;
 elsif actor=rw.vendor_id then rcp:=rw.partner_id; select coalesce(nullif(business->>'name',''),'Your vendor') into an from ss_profiles where id=actor;
 else return null; end if;
 verb:=case tg_op when 'INSERT' then 'added' when 'UPDATE' then 'updated' else 'deleted' end;
 lbl:=case rw.kind when 'plead' then 'lead' when 'pproj' then 'project' when 'pmat' then 'material' when 'ptxn' then 'transaction' else rw.kind end;
 nm:=coalesce(nullif(d->>'name',''),nullif(d->>'item',''),nullif(d->>'type',''),'');
 msg:=coalesce(an,'Someone')||' '||verb||' '||lbl||case when nm<>'' then ': '||nm else '' end||case when rw.kind='ptxn' then ' · Rs '||coalesce(d->>'amount','0') when rw.kind='pmat' and d->>'status' is not null then ' · '||(d->>'status') else '' end;
 perform ss_notify(rcp,initcap(lbl)||' '||verb,msg,'partner','pd:'||rw.partner_id||':'||rw.kind);
 return null;
end$$;
drop trigger if exists ss_prn on ss_partner_records;
create trigger ss_prn after insert or update or delete on ss_partner_records for each row execute function ss_pr_notify();

-- staff activity + customer service request notifications to the vendor
create or replace function ss_rec_notify() returns trigger language plpgsql security definer set search_path=public as $$
declare actor uuid:=auth.uid(); an text; d jsonb:=new.data; lbl text;
begin
 if actor is null then
  if new.kind='ticket' and d->>'src'='Customer' then perform ss_notify(new.user_id,'New service request',coalesce(d->>'cust','Customer')||' · '||left(coalesce(d->>'issue',''),100),'ticket','svc'); end if;
  return null;
 end if;
 if actor=new.user_id or new.kind not in ('lead','quote','customer','ticket','expense','stock') then return null; end if;
 select email into an from ss_profiles where id=actor;
 lbl:=case new.kind when 'customer' then 'project' when 'stock' then 'procurement item' else new.kind end;
 perform ss_notify(new.user_id,'Staff added '||lbl,coalesce(an,'Staff')||' added '||lbl||': '||coalesce(nullif(d->>'name',''),nullif(d->>'cust',''),nullif(d->>'title',''),nullif(d->>'item',''),''),'staff',case new.kind when 'lead' then 'lead' when 'quote' then 'quote' when 'customer' then 'cust' when 'ticket' then 'svc' when 'stock' then 'stock' else 'books' end);
 return null;
end$$;
drop trigger if exists ss_rcn on ss_records;
create trigger ss_rcn after insert on ss_records for each row execute function ss_rec_notify();

-- ------------------------------------------------------------------ 9. TABLE / FUNCTION PERMISSIONS (GRANTs)
-- New Supabase projects no longer grant API access to tables automatically, which shows up as
-- "permission denied for table ..." at login. Row Level Security above still decides WHICH rows each user may touch.
grant usage on schema public to anon, authenticated, service_role;

grant select                         on ss_plans           to anon, authenticated;
grant insert, update, delete         on ss_plans           to authenticated;          -- owner only (RLS)
grant select, update                 on ss_profiles        to authenticated;          -- rows are created by the signup trigger
grant select, insert, update, delete on ss_records         to authenticated;
grant select, insert, update, delete on ss_partner_records to authenticated;
grant select, update, delete         on ss_notifications   to authenticated;          -- rows are created by triggers only
grant all on ss_plans, ss_profiles, ss_records, ss_partner_records, ss_notifications to service_role;

grant execute on function is_owner()   to anon, authenticated;
grant execute on function my_parent()  to anon, authenticated;
grant execute on function is_partner() to anon, authenticated;


-- Support reply -> notify the user who submitted the ticket.
-- Safe when ss_platform_tickets is not installed yet; rerun after its table exists.
DO $ss_support_notify_setup$
BEGIN
  IF to_regclass('public.ss_platform_tickets') IS NOT NULL
     AND EXISTS (SELECT 1 FROM information_schema.columns WHERE table_schema='public' AND table_name='ss_platform_tickets' AND column_name='owner_reply')
     AND EXISTS (SELECT 1 FROM information_schema.columns WHERE table_schema='public' AND table_name='ss_platform_tickets' AND column_name='user_id') THEN
    EXECUTE $fn$
      CREATE OR REPLACE FUNCTION public.ss_notify_user_support_reply()
      RETURNS trigger LANGUAGE plpgsql SECURITY DEFINER SET search_path=public AS $body$
      BEGIN
        IF NEW.owner_reply IS DISTINCT FROM OLD.owner_reply
           AND NULLIF(BTRIM(COALESCE(NEW.owner_reply,'')), '') IS NOT NULL THEN
          PERFORM public.ss_notify(
            NEW.user_id,
            'Website support response received',
            'The website owner replied to your support request: ' || COALESCE(NEW.subject,'Support request') || '. Open Website Support to read the response.',
            'support_reply',
            'support:' || NEW.id::text
          );
        END IF;
        RETURN NEW;
      END;
      $body$
    $fn$;
    EXECUTE 'DROP TRIGGER IF EXISTS ss_notify_user_support_reply_trg ON public.ss_platform_tickets';
    EXECUTE 'CREATE TRIGGER ss_notify_user_support_reply_trg AFTER UPDATE OF owner_reply ON public.ss_platform_tickets FOR EACH ROW EXECUTE FUNCTION public.ss_notify_user_support_reply()';
  END IF;
END
$ss_support_notify_setup$;
</script>
<script type="text/plain" id="sql">-- =====================================================================================
--  SOLAR STACK  -  COMPLETE DATABASE SETUP  (for a brand-new Supabase project)
--  Powered by SRD Sons Technologies
--
--  HOW TO USE
--   1. Supabase Dashboard -> Authentication -> Providers -> Email : turn OFF "Confirm email"
--      (needed so vendors can create staff / channel-partner logins that work immediately).
--   2. Supabase Dashboard -> SQL Editor -> New query -> paste this ENTIRE file -> Run.
--   3. Open the website and sign up. THE VERY FIRST ACCOUNT BECOMES THE OWNER
--      (SRD Sons Technologies). Every later sign-up is an EPC vendor.
--   4. Log in as Owner -> Plans: review / edit the sample packages
--      (set "Channel partners allowed" > 0 for packages that include Channel Partners).
--
--  The script is idempotent: running it again on the same project is safe.
-- =====================================================================================

-- ------------------------------------------------------------------ 1. TABLES
create table if not exists ss_plans(
  id uuid primary key default gen_random_uuid(),
  name text,
  price numeric,
  days int,
  max_customers int default 0,          -- 0 = unlimited customers
  max_partners int default 0,           -- 0 = Channel Partners / Sub-Vendors NOT included
  features text
);
alter table ss_plans add column if not exists max_partners int default 0;

create table if not exists ss_profiles(
  id uuid primary key references auth.users on delete cascade,
  email text,
  role text default 'user',             -- 'owner' (SRD Sons) or 'user' (EPC vendor / staff / partner)
  active boolean default true,
  business jsonb default '{}',
  plan_id uuid,
  plan_name text,
  plan_expiry date,
  plan_request uuid,
  created_at timestamptz default now()
);
alter table ss_profiles add column if not exists parent uuid;   -- staff / partner -> their vendor
alter table ss_profiles add column if not exists ptype text;    -- 'partner' = channel partner / sub-vendor, null = staff or vendor

create table if not exists ss_records(
  id uuid primary key default gen_random_uuid(),
  user_id uuid default auth.uid(),      -- the vendor that owns the record
  kind text not null,                   -- customer, lead, quote, expense, stock, ticket, member, task, doctpl ...
  data jsonb not null,
  created_at timestamptz default now()
);
create index if not exists ss_rec_user_kind on ss_records(user_id,kind,created_at desc);

create table if not exists ss_partner_records(
  id uuid primary key default gen_random_uuid(),
  vendor_id uuid not null,
  partner_id uuid not null,
  kind text not null,                   -- plead (lead), pproj (project), pmat (material), ptxn (transaction)
  data jsonb not null default '{}',
  created_at timestamptz default now()
);
create index if not exists ss_pr_v on ss_partner_records(vendor_id,created_at desc);
create index if not exists ss_pr_p on ss_partner_records(partner_id,created_at desc);

create table if not exists ss_notifications(
  id uuid primary key default gen_random_uuid(),
  user_id uuid not null,
  title text,
  body text,
  kind text,
  ref text,
  read boolean default false,
  n int default 1,
  created_at timestamptz default now()
);
create index if not exists ss_nt_u on ss_notifications(user_id,created_at desc);

-- ------------------------------------------------------------------ 2. HELPER FUNCTIONS
create or replace function is_owner() returns boolean language sql security definer stable set search_path=public as $$
  select exists(select 1 from ss_profiles where id=auth.uid() and role='owner') $$;

create or replace function my_parent() returns uuid language sql security definer stable set search_path=public as $$
  select parent from ss_profiles where id=auth.uid() $$;

create or replace function is_partner() returns boolean language sql security definer stable set search_path=public as $$
  select exists(select 1 from ss_profiles where id=auth.uid() and ptype='partner') $$;

-- profile is created automatically for every new auth user; the first one becomes the owner
create or replace function ss_new_user() returns trigger language plpgsql security definer set search_path=public as $$
begin
  insert into ss_profiles(id,email,role,business)
  values(new.id,new.email,case when exists(select 1 from ss_profiles) then 'user' else 'owner' end,jsonb_build_object('name',new.raw_user_meta_data->>'biz'));
  return new;
end$$;
drop trigger if exists ss_nu on auth.users;
create trigger ss_nu after insert on auth.users for each row execute function ss_new_user();

-- users cannot change their own role / plan / parent / partner flag / active flag
create or replace function ss_guard() returns trigger language plpgsql security definer set search_path=public as $$
begin
  if not is_owner() then
    new.role=old.role; new.plan_id=old.plan_id; new.plan_name=old.plan_name; new.plan_expiry=old.plan_expiry;
    if coalesce(current_setting('ss.staff',true),'')<>'1' then
      new.parent=old.parent; new.ptype=old.ptype; new.active=old.active;
    end if;
  end if;
  return new;
end$$;
drop trigger if exists ss_g on ss_profiles;
create trigger ss_g before update on ss_profiles for each row execute function ss_guard();

-- ------------------------------------------------------------------ 3. STAFF / PARTNER MANAGEMENT (vendor side)
-- link a just-created login as STAFF of the calling vendor
create or replace function ss_add_staff(em text) returns void language plpgsql security definer set search_path=public as $$
begin
  perform set_config('ss.staff','1',true);
  update ss_profiles set parent=auth.uid(), ptype=null
   where lower(email)=lower(em) and parent is null and role='user'
     and created_at>now()-interval '10 minutes' and id<>auth.uid();
end$$;

-- link a just-created login as CHANNEL PARTNER / SUB-VENDOR (only if the vendor's package includes partners)
create or replace function ss_add_partner(em text, biz jsonb) returns void language plpgsql security definer set search_path=public as $$
declare mx int; exp date; cnt int;
begin
  select coalesce(p.max_partners,0), u.plan_expiry into mx, exp
    from ss_profiles u left join ss_plans p on p.id=u.plan_id where u.id=auth.uid();
  if coalesce(mx,0)<=0 then raise exception 'Your package does not include Channel Partners. Please upgrade your package.'; end if;
  if exp is null or exp<current_date then raise exception 'Your package has expired. Please renew to add channel partners.'; end if;
  select count(*) into cnt from ss_profiles where parent=auth.uid() and ptype='partner';
  if cnt>=mx then raise exception 'Your package allows up to % channel partner(s). Please upgrade your package to add more.', mx; end if;
  perform set_config('ss.staff','1',true);
  update ss_profiles set parent=auth.uid(), ptype='partner', business=coalesce(biz,'{}'::jsonb)
   where lower(email)=lower(em) and parent is null and role='user'
     and created_at>now()-interval '10 minutes' and id<>auth.uid();
  if not found then raise exception 'Could not link the partner account. The email may already be registered.'; end if;
end$$;

-- vendor edits / enables / disables a staff or partner login that belongs to them
create or replace function ss_child_update(cid uuid, act boolean, biz jsonb) returns void language plpgsql security definer set search_path=public as $$
begin
  if not exists(select 1 from ss_profiles where id=cid and parent=auth.uid()) then raise exception 'Not allowed'; end if;
  perform set_config('ss.staff','1',true);
  update ss_profiles set active=coalesce(act,active), business=coalesce(biz,business) where id=cid;
end$$;

-- vendor permanently removes a staff / partner login
create or replace function ss_child_delete(cid uuid) returns void language plpgsql security definer set search_path=public as $$
begin
  if not exists(select 1 from ss_profiles where id=cid and parent=auth.uid()) then raise exception 'Not allowed'; end if;
  delete from auth.users where id=cid;
end$$;

grant execute on function my_parent() to authenticated;
grant execute on function is_partner() to authenticated;
grant execute on function ss_add_staff(text) to authenticated;
grant execute on function ss_add_partner(text,jsonb) to authenticated;
grant execute on function ss_child_update(uuid,boolean,jsonb) to authenticated;
grant execute on function ss_child_delete(uuid) to authenticated;

-- ------------------------------------------------------------------ 4. PUBLIC FUNCTIONS (customer tracking link + service-request form)
create or replace function ss_track(tid uuid) returns jsonb language sql security definer stable set search_path=public as $$
  select jsonb_build_object('c',r.data-'pay'-'cost'-'docs'-'phone'-'addr',
                            'b',jsonb_build_object('name',p.business->>'name','logo',p.business->>'logo','phone',p.business->>'phone'),
                            'v',r.user_id)
  from ss_records r join ss_profiles p on p.id=r.user_id where r.id=tid and r.kind='customer' $$;

create or replace function ss_ticket_info(vid uuid) returns jsonb language sql security definer stable set search_path=public as $$
  select jsonb_build_object('name',business->>'name','logo',business->>'logo','phone',business->>'phone','addr',business->>'addr','city',business->>'city')
  from ss_profiles where id=vid and role='user' and parent is null and active $$;

create or replace function ss_vendor_ok(p text) returns boolean language sql security definer stable set search_path=public as $$
  select exists(select 1 from ss_profiles where id::text=p and role='user' and parent is null and active) $$;

create or replace function ss_submit_ticket(vid uuid, p jsonb) returns jsonb language plpgsql security definer set search_path=public as $$
declare nm text:=left(trim(coalesce(p->>'name','')),80);
        ph text:=right(regexp_replace(coalesce(p->>'phone',''),'\D','','g'),10);
        iss text:=left(trim(coalesce(p->>'issue','')),1500);
        ty text:=left(coalesce(nullif(p->>'type',''),'Complaint'),60);
        pri text:=coalesce(p->>'priority','Medium'); pth text:=p->>'photo'; n int; tno text;
        today date:=(now() at time zone 'Asia/Kolkata')::date;
begin
  if not exists(select 1 from ss_profiles where id=vid and role='user' and parent is null and active) then raise exception 'This service link is not valid'; end if;
  if nm='' or iss='' or length(ph)<10 then raise exception 'Please enter your name, a 10-digit phone number and the issue'; end if;
  if pri not in ('Low','Medium','High','Urgent') then pri:='Medium'; end if;
  if pth is not null and pth not like vid::text||'/tickets/%' then pth:=null; end if;
  select count(*) into n from ss_records where user_id=vid and kind='ticket' and data->>'src'='Customer' and data->>'phone'=ph and created_at>now()-interval '1 day';
  if n>=5 then raise exception 'Too many requests from this number today. Please call us directly.'; end if;
  select count(*) into n from ss_records where user_id=vid and kind='ticket' and data->>'src'='Customer' and created_at>now()-interval '1 hour';
  if n>=60 then raise exception 'We are receiving many requests right now. Please try again later.'; end if;
  select count(*)+1 into n from ss_records where user_id=vid and kind='ticket';
  tno:='TK-'||lpad(n::text,4,'0');
  insert into ss_records(user_id,kind,data) values(vid,'ticket',jsonb_build_object('no',tno,'cust',nm,'phone',ph,'addr',left(coalesce(p->>'addr',''),300),'issue',iss,'type',ty,'priority',pri,'status','Open','src','Customer','created',today::text,'due',(today+2)::text,'photo',pth));
  return jsonb_build_object('no',tno,'due',(today+2)::text);
end$$;

create or replace function ss_ticket_lookup(vid uuid, tno text, ph text) returns jsonb language sql security definer stable set search_path=public as $$
  select jsonb_build_object('no',data->>'no','status',data->>'status','type',data->>'type','issue',data->>'issue','created',data->>'created','due',data->>'due','reply',data->>'reply')
  from ss_records where user_id=vid and kind='ticket' and upper(data->>'no')=upper(trim(tno))
   and right(regexp_replace(coalesce(data->>'phone',''),'\D','','g'),10)=right(regexp_replace(coalesce(ph,''),'\D','','g'),10) limit 1 $$;

grant execute on function ss_track(uuid) to anon, authenticated;
grant execute on function ss_ticket_info(uuid) to anon, authenticated;
grant execute on function ss_submit_ticket(uuid,jsonb) to anon, authenticated;
grant execute on function ss_ticket_lookup(uuid,text,text) to anon, authenticated;
grant execute on function ss_vendor_ok(text) to anon, authenticated;

-- ------------------------------------------------------------------ 5. NOTIFICATIONS ENGINE
-- (only callable from triggers; clients cannot call it directly)
create or replace function ss_notify(uid uuid,t text,b text,k text,r text) returns void language plpgsql security definer set search_path=public as $$
declare x uuid;
begin
  if uid is null then return; end if;
  -- bursts of the same alert within 2 minutes are merged ("+N more")
  select id into x from ss_notifications where user_id=uid and title=t and coalesce(ref,'')=coalesce(r,'') and not read and created_at>now()-interval '2 minutes' order by created_at desc limit 1;
  if x is not null then update ss_notifications set body=left(b,500), n=n+1, created_at=now() where id=x;
  else insert into ss_notifications(user_id,title,body,kind,ref) values(uid,left(t,160),left(b,500),k,r); end if;
end$$;
revoke all on function ss_notify(uuid,text,text,text,text) from public, anon, authenticated;

-- vendor <-> channel partner activity
create or replace function ss_pr_notify() returns trigger language plpgsql security definer set search_path=public as $$
declare actor uuid:=auth.uid(); rw ss_partner_records; rcp uuid; an text; verb text; lbl text; nm text; msg text; d jsonb;
begin
  if tg_op='DELETE' then rw:=old; else rw:=new; end if;
  d:=rw.data;
  if tg_op='UPDATE' and old.data=new.data then return null; end if;
  if actor is null then return null; end if;
  if actor=rw.partner_id then
    rcp:=rw.vendor_id; select coalesce(nullif(business->>'name',''),email) into an from ss_profiles where id=actor;
  elsif actor=rw.vendor_id then
    rcp:=rw.partner_id; select coalesce(nullif(business->>'name',''),'Your vendor') into an from ss_profiles where id=actor;
  else return null; end if;
  verb:=case tg_op when 'INSERT' then 'added' when 'UPDATE' then 'updated' else 'deleted' end;
  lbl:=case rw.kind when 'plead' then 'lead' when 'pproj' then 'project' when 'pmat' then 'material' when 'ptxn' then 'transaction' else rw.kind end;
  nm:=coalesce(nullif(d->>'name',''),nullif(d->>'item',''),nullif(d->>'type',''),'');
  msg:=coalesce(an,'Someone')||' '||verb||' '||lbl||case when nm<>'' then ': '||nm else '' end
       ||case when rw.kind='ptxn' then ' · Rs '||coalesce(d->>'amount','0') when rw.kind='pmat' and d->>'status' is not null then ' · '||(d->>'status') else '' end;
  perform ss_notify(rcp,initcap(lbl)||' '||verb,msg,'partner','pd:'||rw.partner_id||':'||rw.kind);
  return null;
end$$;
drop trigger if exists ss_prn on ss_partner_records;
create trigger ss_prn after insert or update or delete on ss_partner_records for each row execute function ss_pr_notify();

-- staff additions + customer service requests -> vendor
create or replace function ss_rec_notify() returns trigger language plpgsql security definer set search_path=public as $$
declare actor uuid:=auth.uid(); an text; d jsonb:=new.data; lbl text;
begin
  if actor is null then
    if new.kind='ticket' and d->>'src'='Customer' then
      perform ss_notify(new.user_id,'New service request',coalesce(d->>'cust','Customer')||' · '||left(coalesce(d->>'issue',''),100),'ticket','svc');
    end if;
    return null;
  end if;
  if actor=new.user_id or new.kind not in ('lead','quote','customer','ticket','expense','stock') then return null; end if;
  select email into an from ss_profiles where id=actor;
  lbl:=case new.kind when 'customer' then 'project' when 'stock' then 'procurement item' else new.kind end;
  perform ss_notify(new.user_id,'Staff added '||lbl,
     coalesce(an,'Staff')||' added '||lbl||': '||coalesce(nullif(d->>'name',''),nullif(d->>'cust',''),nullif(d->>'title',''),nullif(d->>'item',''),''),
     'staff',case new.kind when 'lead' then 'lead' when 'quote' then 'quote' when 'customer' then 'cust' when 'ticket' then 'svc' when 'stock' then 'stock' else 'books' end);
  return null;
end$$;
drop trigger if exists ss_rcn on ss_records;
create trigger ss_rcn after insert on ss_records for each row execute function ss_rec_notify();

-- ------------------------------------------------------------------ 6. ROW LEVEL SECURITY
alter table ss_plans            enable row level security;
alter table ss_profiles         enable row level security;
alter table ss_records          enable row level security;
alter table ss_partner_records  enable row level security;
alter table ss_notifications    enable row level security;

-- plans: everyone can read (shown on the home page), only the owner edits
drop policy if exists pl_r on ss_plans;  create policy pl_r on ss_plans for select using(true);
drop policy if exists pl_w on ss_plans;  create policy pl_w on ss_plans for all using(is_owner()) with check(is_owner());

-- profiles: own row, own staff/partners, own vendor, or owner sees all
drop policy if exists pr_r on ss_profiles;
create policy pr_r on ss_profiles for select using(auth.uid()=id or parent=auth.uid() or id=my_parent() or is_owner());
drop policy if exists pr_u on ss_profiles;
create policy pr_u on ss_profiles for update using(auth.uid()=id or is_owner());

-- vendor records: the vendor, the vendor's STAFF (not partners), and the owner
drop policy if exists rc_a on ss_records;
create policy rc_a on ss_records for all
  using(auth.uid()=user_id or (user_id=my_parent() and not is_partner()) or is_owner())
  with check(auth.uid()=user_id or (user_id=my_parent() and not is_partner()));

-- partner records: shared between a vendor and ITS channel partner only
drop policy if exists spr_a on ss_partner_records;
create policy spr_a on ss_partner_records for all
  using(auth.uid()=vendor_id or (auth.uid()=partner_id and exists(select 1 from ss_profiles where id=auth.uid() and active)) or is_owner())
  with check((auth.uid()=vendor_id and exists(select 1 from ss_profiles c where c.id=partner_id and c.parent=auth.uid()))
          or (auth.uid()=partner_id and vendor_id=my_parent() and exists(select 1 from ss_profiles where id=auth.uid() and active)));

-- notifications: each user reads / updates / deletes only their own (rows are inserted by triggers only)
drop policy if exists nt_s on ss_notifications; create policy nt_s on ss_notifications for select using(auth.uid()=user_id);
drop policy if exists nt_u on ss_notifications; create policy nt_u on ss_notifications for update using(auth.uid()=user_id) with check(auth.uid()=user_id);
drop policy if exists nt_d on ss_notifications; create policy nt_d on ss_notifications for delete using(auth.uid()=user_id);

-- ------------------------------------------------------------------ 7. STORAGE (documents + service-ticket photos)
insert into storage.buckets(id,name,public) values('ss-docs','ss-docs',false) on conflict (id) do nothing;
insert into storage.buckets(id,name,public,file_size_limit,allowed_mime_types)
  values('ss-tickets','ss-tickets',false,3145728,array['image/jpeg','image/png','image/webp'])
  on conflict (id) do update set file_size_limit=3145728, allowed_mime_types=array['image/jpeg','image/png','image/webp'];

drop policy if exists docs_all on storage.objects;
create policy docs_all on storage.objects for all to authenticated
  using(bucket_id='ss-docs' and ((storage.foldername(name))[1]=auth.uid()::text or ((storage.foldername(name))[1]=my_parent()::text and not is_partner())))
  with check(bucket_id='ss-docs' and ((storage.foldername(name))[1]=auth.uid()::text or ((storage.foldername(name))[1]=my_parent()::text and not is_partner())));

drop policy if exists tk_up on storage.objects;
create policy tk_up on storage.objects for insert to anon, authenticated
  with check(bucket_id='ss-tickets' and (storage.foldername(name))[2]='tickets' and public.ss_vendor_ok((storage.foldername(name))[1]));
drop policy if exists tk_rd on storage.objects;
create policy tk_rd on storage.objects for select to authenticated
  using(bucket_id='ss-tickets' and ((storage.foldername(name))[1]=auth.uid()::text or ((storage.foldername(name))[1]=my_parent()::text and not is_partner())));
drop policy if exists tk_dl on storage.objects;
create policy tk_dl on storage.objects for delete to authenticated
  using(bucket_id='ss-tickets' and ((storage.foldername(name))[1]=auth.uid()::text or ((storage.foldername(name))[1]=my_parent()::text and not is_partner())));

-- ------------------------------------------------------------------ 8. SAMPLE PACKAGES (edit freely from Owner -> Plans)
insert into ss_plans(name,price,days,max_customers,max_partners,features)
select * from (values
  ('Starter',  999::numeric,  30, 25, 0, 'Lead CRM, Smart proposals, Project lifecycle, Payments & books, Staff logins'),
  ('Professional',2499::numeric, 90, 150, 5, 'Everything in Starter, Channel partners / sub-vendors, Notifications, Service & O&M'),
  ('Business', 8999::numeric, 365, 0, 25, 'Unlimited customers, Channel partners / sub-vendors, Priority support')
) as v(name,price,days,max_customers,max_partners,features)
where not exists(select 1 from ss_plans);

-- ------------------------------------------------------------------ 9. TABLE / FUNCTION PERMISSIONS (GRANTs)
-- New Supabase projects no longer grant API access to tables automatically, which shows up as
-- "permission denied for table ..." at login. Row Level Security above still decides WHICH rows each user may touch.
grant usage on schema public to anon, authenticated, service_role;

grant select                         on ss_plans           to anon, authenticated;
grant insert, update, delete         on ss_plans           to authenticated;          -- owner only (RLS)
grant select, update                 on ss_profiles        to authenticated;          -- rows are created by the signup trigger
grant select, insert, update, delete on ss_records         to authenticated;
grant select, insert, update, delete on ss_partner_records to authenticated;
grant select, update, delete         on ss_notifications   to authenticated;          -- rows are created by triggers only
grant all on ss_plans, ss_profiles, ss_records, ss_partner_records, ss_notifications to service_role;

grant execute on function is_owner()   to anon, authenticated;
grant execute on function my_parent()  to anon, authenticated;
grant execute on function is_partner() to anon, authenticated;


-- Support reply -> notify the user who submitted the ticket.
-- Safe when ss_platform_tickets is not installed yet; rerun after its table exists.
DO $ss_support_notify_setup$
BEGIN
  IF to_regclass('public.ss_platform_tickets') IS NOT NULL
     AND EXISTS (SELECT 1 FROM information_schema.columns WHERE table_schema='public' AND table_name='ss_platform_tickets' AND column_name='owner_reply')
     AND EXISTS (SELECT 1 FROM information_schema.columns WHERE table_schema='public' AND table_name='ss_platform_tickets' AND column_name='user_id') THEN
    EXECUTE $fn$
      CREATE OR REPLACE FUNCTION public.ss_notify_user_support_reply()
      RETURNS trigger LANGUAGE plpgsql SECURITY DEFINER SET search_path=public AS $body$
      BEGIN
        IF NEW.owner_reply IS DISTINCT FROM OLD.owner_reply
           AND NULLIF(BTRIM(COALESCE(NEW.owner_reply,'')), '') IS NOT NULL THEN
          PERFORM public.ss_notify(
            NEW.user_id,
            'Website support response received',
            'The website owner replied to your support request: ' || COALESCE(NEW.subject,'Support request') || '. Open Website Support to read the response.',
            'support_reply',
            'support:' || NEW.id::text
          );
        END IF;
        RETURN NEW;
      END;
      $body$
    $fn$;
    EXECUTE 'DROP TRIGGER IF EXISTS ss_notify_user_support_reply_trg ON public.ss_platform_tickets';
    EXECUTE 'CREATE TRIGGER ss_notify_user_support_reply_trg AFTER UPDATE OF owner_reply ON public.ss_platform_tickets FOR EACH ROW EXECUTE FUNCTION public.ss_notify_user_support_reply()';
  END IF;
END
$ss_support_notify_setup$;
</script>

const sbFetch=async(url,opt={})=>{const m=(opt.method||'GET').toUpperCase(),get=m==='GET'||m==='HEAD',tries=get?3:1;let last;
 for(let i=0;i<tries;i++){const ac=new AbortController(),to=setTimeout(()=>ac.abort(),get?(i?30000:20000):45000),sg=opt.signal;
  if(sg){if(sg.aborted)ac.abort();else sg.addEventListener('abort',()=>ac.abort(),{once:true})}
  try{const r=await fetch(url,{...opt,signal:ac.signal});clearTimeout(to);if(get&&r.status>=502&&i<tries-1){await sleep(700*(i+1));continue}return r}
  catch(e){clearTimeout(to);last=e;if(sg&&sg.aborted)throw e;if(i<tries-1)await sleep(700*(i+1))}}
 throw last};

const pc=(p,b)=>{
  const days=Math.max(0,Number(p.days)||0);
  let duration;
  if(days&&days%365===0){const n=days/365;duration=`${n} ${n===1?'Year':'Years'}`;}
  else if(days&&days%30===0){const n=days/30;duration=`${n} ${n===1?'Month':'Months'}`;}
  else{duration=`${days} ${days===1?'Day':'Days'}`;}

  // Features are display-only. Never render a numeric-only value such as "1"
  // as a separate feature; numeric values belong to the validity calculation.
  const raw=String(p.features??'').trim();
  let featureList=[];
  const cleanFeature=(value)=>String(value??'')
    .replace(/<[^>]*>/g,' ')
    .replace(/[\[\]{}"']/g,' ')
    .replace(/\s+/g,' ')
    .trim();
  if(raw){
    try{
      const parsed=JSON.parse(raw);
      featureList=Array.isArray(parsed)?parsed:(typeof parsed==='string'?[parsed]:[]);
    }catch(e){
      featureList=raw.split(/[,;|\n]+/);
    }
  }
  const features=featureList
    .map(cleanFeature)
    .flatMap(x=>x.split(/[,;|]+/))
    .map(cleanFeature)
    .filter(Boolean)
    .filter(x=>!/^\d+(?:\.\d+)?$/.test(x));

  return `<div class="card pc"><h3>${esc(p.name)}</h3><b class="p">${inr(p.price)}</b><div class="mu">for ${duration} · ${p.max_customers>0?p.max_customers+' customers':'Unlimited customers'}</div><div class="mu" style="margin-top:4px">🤝 ${p.max_partners>0?'Up to '+p.max_partners+' channel partner'+(p.max_partners>1?'s':'')+' / sub-vendors':'Channel partners not included'}</div><ul>${features.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>${b||''}</div>`;
};

async function out(){
  // Sign out locally even if the network request fails, then return to the login screen.
  const buttons=[...document.querySelectorAll('button')].filter(b=>/sign\s*out/i.test(b.textContent||''));
  buttons.forEach(b=>{b.disabled=true;b.dataset.oldText=b.textContent;b.textContent='Signing out…'});
  try{
    const {error}=await sb.auth.signOut({scope:'local'});
    if(error) console.warn('Supabase sign-out reported an error; clearing this browser session locally.',error);
  }catch(e){console.warn('Supabase sign-out request failed; clearing this browser session locally.',e)}
  try{
    // Supabase's default storage key is based on the project ref in the URL.
    const authKey='sb-'+new URL(U).hostname.split('.')[0]+'-auth-token';
    localStorage.removeItem(authKey);
    sessionStorage.removeItem(authKey);
    // Also remove any matching project auth keys in case the SDK key changes.
    for(const storage of [localStorage,sessionStorage]){
      for(let i=storage.length-1;i>=0;i--){const key=storage.key(i);if(key&&key.startsWith('sb-'+new URL(U).hostname.split('.')[0]+'-')&&/auth-token|code-verifier/.test(key))storage.removeItem(key)}
    }
  }catch(e){console.warn('Could not clear browser auth storage.',e)}
  cacheClear();LOADED=0;CACHEONLY=0;P=null;R=[];US=[];D={};PT=[];PR=[];NT=[];NKNOWN=null;PSEL='';NOTE_OFF=0;NOPART=0;

  buttons.forEach(b=>{b.disabled=false;b.textContent=b.dataset.oldText||'Sign out'});
  toast('You have been signed out.');
}

function cf(id){if(!okPlan())return toast('Choose a plan first');const mx=myPlan()?.max_customers;if(!id&&mx>0&&R.length>=mx)return toast('Plan limit reached. Upgrade your plan.');
const c=id?R.find(x=>x.id==id):{type:'On-grid Rooftop'},f=(k,l,t='text')=>`<div><label>${l}</label><input id="c_${k}" type="${t}" value="${esc(c[k])}"></div>`;
M(`<h3>${id?'Edit':'New'} customer</h3><div class="fg">${f('name','Customer name')}${f('phone','Phone','tel')}<div class="w"><label>Address</label><input id="c_addr" value="${esc(c.addr)}"></div><div><label>Project type</label><select id="c_type">${Object.keys(TY).map(t=>`<option ${c.type==t?'selected':''}>${t}</option>`).join('')}</select></div>${f('kw','System size (kW)','number')}${f('cost','Project cost ₹','number')}</div><p><button class="btn" onclick="cs('${id||''}')">Save</button> <button class="btn s" onclick="closeM()">Cancel</button></p>`)}
async function cs(id){const c=id?R.find(x=>x.id==id):{done:{},pay:[]},o={...c};['name','phone','addr','type','kw','cost'].forEach(k=>o[k]=$('c_'+k).value);if(!o.name)return toast('Name required');
if(await put('ss_records',o,id||null)){closeM();go('cust');toast('Saved')}}
function cv(id){const c=R.find(x=>x.id==id),s=stg(c),d=c.done||{};
M(`<div class="top"><div><h3>${esc(c.name)}</h3><div class="mu">${esc(c.type)} · ${esc(c.kw)} kW · ${esc(c.phone)}<br>${esc(c.addr)}</div></div><div><a class="btn s" href="https://wa.me/${String(c.phone).replace(/\D/g,'')}" target="_blank">WhatsApp</a> <button class="btn s" onclick="tl('${id}')">Tracking link</button> <button class="btn s" onclick="cf('${id}')">Edit</button> <button class="btn s d" onclick="cdel('${id}')">Delete</button></div></div>
<div class="bar"><i style="width:${pr(c)}%"></i></div><p class="mu">${pr(c)}% complete · Next: <b>${esc(cur(c))}</b></p>
${s.map((n,i)=>`<div class="stp"><input type="checkbox" ${d[i]?'checked':''} onchange="cu('${id}',${i},'chk',this.checked)"><b>${i+1}. ${n}</b><input type="date" value="${d[i]?.date||''}" ${d[i]?'':'disabled'} onchange="cu('${id}',${i},'date',this.value)"><input class="n" placeholder="Note" value="${esc(d[i]?.note)}" ${d[i]?'':'disabled'} onchange="cu('${id}',${i},'note',this.value)"></div>`).join('')}
<h3 style="margin-top:14px">Project documents (auto-filled)</h3>${tpls(c).map(x=>`<div><a href="#" onclick="pdoc('${id}','${x.id}');return false">🖨 ${esc(x.title)}</a></div>`).join('')||'<div class="mu">No templates yet. Add them in Templates.</div>'}${tpls(c).length?`<p><button class="btn s" onclick="pall('${id}')">Print all documents</button></p>`:''}<h3 style="margin-top:14px">Documents</h3>${(c.docs||[]).map((d,i)=>`<div class="mu"><a href="#" onclick="dopen('${id}',${i});return false">📎 ${esc(d.name)}</a> · <a href="#" onclick="ddel('${id}',${i});return false">remove</a></div>`).join('')}<input type="file" onchange="dup('${id}',this)"><h3 style="margin-top:14px">Payments</h3><p>Cost ${inr(c.cost)} · Received <b>${inr(pd(c))}</b> · Balance <b>${inr((+c.cost||0)-pd(c))}</b></p>
${(c.pay||[]).map((p,i)=>`<div class="mu">${p.date} · ${inr(p.amt)} · ${esc(p.mode)} <a href="#" onclick="pdl('${id}',${i});return false">remove</a></div>`).join('')}
<div class="fg" style="margin-top:8px"><input id="pa" type="number" placeholder="Amount ₹"><select id="pm"><option>Cash</option><option>UPI</option><option>Bank</option><option>Cheque</option></select></div><p><button class="btn a" onclick="pad('${id}')">+ Add payment</button></p>${pxBlock(id)}<p><button class="btn s" onclick="closeM()">Close</button></p>`)}
async function cu(id,i,k,val){const c=R.find(x=>x.id==id);c.done=c.done||{};if(k=='chk'){val?c.done[i]={date:today(),note:''}:delete c.done[i]}else c.done[i][k]=val;const am=k=='chk'&&val&&i==stg(c).length-1&&!c.amc;if(am)c.amc=1;await put('ss_records',c,id);if(am){const a=x=>{const d=new Date();d.setMonth(d.getMonth()+x);return d.toISOString().slice(0,10)};for(const [x,y] of [[3,'Cleaning'],[6,'AMC visit'],[12,'AMC visit']])await put('ss_records',{cust:c.name,issue:y+' - '+c.name,type:y,due:a(x),status:'Open'},null,'ticket');toast('AMC reminders added to Service')}await rl(id)}
async function pad(id){const a=+$('pa').value;if(!a)return toast('Enter amount');const c=R.find(x=>x.id==id);c.pay=[...(c.pay||[]),{date:today(),amt:a,mode:$('pm').value}];await put('ss_records',c,id);rl(id)}
async function pdl(id,i){const c=R.find(x=>x.id==id);c.pay.splice(i,1);await put('ss_records',c,id);rl(id)}
async function rl(id){const r=await sb.from('ss_records').select('*').eq('user_id',OID()).eq('kind','customer').order('created_at',{ascending:false});R=(r.data||[]).map(x=>({id:x.id,...x.data}));cv(id);$('main').innerHTML=VW[v]()}
async function cdel(id){if(!confirm('Delete this customer?'))return;await sb.from('ss_records').delete().eq('id',id);closeM();go('cust')}

function planU(){const sub=PAYMENTS.find(x=>x.user_id===P.id&&x.status!=='rejected'),chosen=plans.find(p=>p.id===(sub?.plan_id||P.plan_request));return `<h2>Subscription plans</h2><p class="mu">Choose a plan to open the secure payment window. Your access or renewal is activated only after the website owner verifies the payment.</p>${sub?`<div class="ban">Latest payment status: <b>${esc(sub.status||'pending')}</b>${sub.transaction_id?' · UTR: '+esc(sub.transaction_id):''}</div>`:''}<div class="g3">${plans.map(p=>pc(p,`<button class="btn" onclick="choosePlan('${p.id}')">${p.id==P.plan_id?'Renew this plan':'Choose plan'}</button>`)).join('')}</div><p class="mu">Payment window: 15 minutes. Switching to PhonePe, Paytm, Google Pay, or another app will not automatically close this website's payment window. Return here to submit the transaction details.</p>`}
async function choosePlan(id){const p=plans.find(x=>x.id===id);if(!p)return toast('Plan not found');const r=await sb.from('ss_profiles').update({plan_request:id}).eq('id',P.id);if(r.error)return toast(r.error.message);P.plan_request=id;openPaymentWindow(id)}
function openPaymentWindow(id){const p=plans.find(x=>x.id===id);if(!p)return;const ob=OWNERBIZ||{};const start=Date.now();const key='ss_payment_window_'+P.id;localStorage.setItem(key,JSON.stringify({plan_id:id,started_at:start,expires_at:start+15*60*1000}));const amount=Number(p.price||0).toFixed(2);const upi=String(ob.payment_upi||P.business?.payment_upi||'').trim();const note=`Solar Stack ${p.name}`;const upiUrl=upi?`upi://pay?pa=${encodeURIComponent(upi)}&pn=${encodeURIComponent('Solar Stack')}&am=${encodeURIComponent(amount)}&cu=INR&tn=${encodeURIComponent(note)}`:'';const previous=PAYMENTS.find(x=>x.user_id===P.id&&x.plan_id===id&&x.status==='pending');M(`<div style="max-height:82vh;overflow:auto"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px"><h2 style="margin:0">Complete payment</h2><span class="tag b" id="pay_timer">15:00</span></div><p class="mu">Keep this window open. If you switch to a payment app, return to this page after paying. The timer continues based on elapsed time.</p><div class="card" style="text-align:center"><h3>${esc(p.name)}</h3><div style="font-size:30px;font-weight:800;color:var(--pr)">${inr(p.price||0)}</div><p class="mu">Amount to pay for this plan</p>${ob.payment_qr?`<img id="payment_qr_image" src="${esc(ob.payment_qr)}" alt="Solar Stack payment QR" style="display:block;max-width:230px;width:100%;max-height:280px;object-fit:contain;margin:12px auto"><button type="button" class="btn s" onclick="downloadPaymentQR()">⬇ Download QR code</button><div style="margin:12px auto 4px;line-height:1.5"><b>Solar Stack Powered By SRD Sons Technologies</b><br><span class="mu">Website owner business email: ${esc(ob.email||ob.owner_email||ob.business_email||'Please contact website support')}</span></div>`:'<div class="ban">Payment QR is not configured yet. Contact the website owner.</div>'}${upi?`<p>UPI ID: <b>${esc(upi)}</b></p>`:''}<div style="display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px 0">${upiUrl?`<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center;width:100%"><label for="upi_app_choice" class="mu">Choose payment app</label><select id="upi_app_choice" style="max-width:220px"><option value="upi">Default UPI app</option><option value="phonepe">PhonePe</option><option value="paytm">Paytm</option><option value="gpay">Google Pay</option></select><button class="btn" onclick="launchSelectedUPI('${encodeURIComponent(upi)}','${encodeURIComponent(amount)}','${encodeURIComponent(note)}')">Pay ₹${amount} now</button></div>`:''}</div><p class="mu">Your selected amount is included in the payment request when supported by the UPI app. Verify the amount before paying.</p></div><div class="fg"><div class="w"><label>UPI Transaction ID / UTR <span style="color:#c00">*</span></label><input id="txn_id" maxlength="120" placeholder="Enter the transaction ID after successful payment" value="${esc(previous?.transaction_id||'')}"></div><div class="w"><label>Payment status <span style="color:#c00">*</span></label><select id="pay_claim"><option value="">Select status</option><option value="success">Payment successful</option><option value="pending">Payment pending</option></select></div><div class="w"><label>Payer name (as shown in payment app) <span style="color:#c00">*</span></label><input id="payer_name" maxlength="120" placeholder="Enter payer name" value="${esc(P.business?.owner||P.business?.name||'')}"></div><div class="w"><label>Payment date/time <span style="color:#c00">*</span></label><input id="paid_at" type="datetime-local" value="${new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,16)}"></div></div><p id="upi_return_status" class="ban" aria-live="polite">After paying in your UPI app, return here. Your device may not share the payment result automatically; enter the UTR shown by the payment app. The owner verifies receipt before activation.</p><p class="mu">UPI intent links can prefill the amount, but most UPI apps do not provide a trusted success callback to a standalone website. A transaction ID is still required unless a payment gateway is integrated.</p><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" onclick="submitPayment('${p.id}')">Submit payment details</button><button class="btn s" onclick="closePaymentWindow()">Cancel payment</button></div><p id="pay_timer_note" class="mu" aria-live="polite"></p></div>`);startPaymentTimer(key)}
function launchUPI(encoded){try{const url=decodeURIComponent(encoded);localStorage.setItem('ss_payment_return_at',String(Date.now()));localStorage.setItem('ss_payment_return_pending','1');window.location.href=url}catch(e){toast('Could not open payment app. Please scan the QR code instead.')}}
function launchSelectedUPI(encUpi,encAmount,encNote){try{const pa=decodeURIComponent(encUpi),amount=decodeURIComponent(encAmount),note=decodeURIComponent(encNote),app=$('upi_app_choice')?.value||'upi';const q='?pa='+encodeURIComponent(pa)+'&pn='+encodeURIComponent('Solar Stack')+'&am='+encodeURIComponent(amount)+'&cu=INR&tn='+encodeURIComponent(note);const scheme=app==='phonepe'?'phonepe://pay':app==='paytm'?'paytmmp://pay':app==='gpay'?'tez://upi/pay':'upi://pay';launchUPI(encodeURIComponent(scheme+q));const noteEl=$('upi_return_status');if(noteEl)noteEl.textContent='Opening payment app… Return here after paying. Payment confirmation will be checked when you submit your transaction details.'}catch(e){toast('Could not open payment app. Please scan the QR code instead.')}}
let paymentTimerInterval=null;
function startPaymentTimer(key){if(paymentTimerInterval)clearInterval(paymentTimerInterval);const tick=()=>{let st;try{st=JSON.parse(localStorage.getItem(key)||'{}')}catch(e){st={}}const remain=Math.max(0,Number(st.expires_at||Date.now())-Date.now());const el=$('pay_timer');if(el)el.textContent=String(Math.floor(remain/60000)).padStart(2,'0')+':'+String(Math.floor((remain%60000)/1000)).padStart(2,'0');const note=$('pay_timer_note');if(note)note.textContent=remain>0?'Payment window remains open even when you switch to another app.': '15-minute timer ended. This window remains open so you can still submit details or cancel.'};tick();paymentTimerInterval=setInterval(tick,1000)}
function closePaymentWindow(){if(!confirm('Close the payment window? Any details not submitted will be lost.'))return;if(paymentTimerInterval)clearInterval(paymentTimerInterval);closeM()}

function lg(inp){
 const f=inp.files[0];if(!f)return;
 const r=new FileReader();r.onload=()=>{
  const im=new Image();im.onload=()=>{
   const max=1400,s=Math.min(1,max/Math.max(im.width,im.height));
   const c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);
   const x=c.getContext('2d');x.drawImage(im,0,0,c.width,c.height);
   try{
    const d=x.getImageData(0,0,c.width,c.height),p=d.data;
    for(let i=0;i<p.length;i+=4){
      const rr=p[i],gg=p[i+1],bb=p[i+2];
      if(rr>247&&gg>247&&bb>247)p[i+3]=0;
      else if(rr>235&&gg>235&&bb>235&&Math.max(rr,gg,bb)-Math.min(rr,gg,bb)<10)p[i+3]=Math.max(0,Math.min(p[i+3],(250-Math.max(rr,gg,bb))*5));
    }
    x.putImageData(d,0,0);
   }catch(e){}
   NL=c.toDataURL('image/png');$('plg').src=NL;
  };im.src=r.result
 };r.readAsDataURL(f)
}

/* Solar Stack EPC branding: derive the UI accent from the logged-in user's uploaded logo. */
(function(){
  let lastLogo='', lastProfile='', lastLogoKey=null, lastNameKey=null;
  const hex=n=>'#'+Math.max(0,Math.min(255,n)).toString(16).padStart(2,'0');

    const nav=rgb.map(v=>Math.round(v*.48));

    root.style.setProperty('--brand-soft',pale); root.style.setProperty('--brand-border','color-mix(in srgb, '+c+' 32%, white)');
    document.querySelectorAll('.btn,.nav a.active,.tag.primary').forEach(el=>el.style.setProperty('--pr',c));
  }
  function sampleLogo(src){
    if(!src){setBrand('#1769e0');return}
    if(src===lastLogo)return; lastLogo=src;
    const img=new Image(); if(!src.startsWith('data:'))img.crossOrigin='anonymous';
    img.onload=()=>{try{
      const cv=document.createElement('canvas'),ctx=cv.getContext('2d',{willReadFrequently:true});
      cv.width=48;cv.height=48;ctx.drawImage(img,0,0,48,48);const d=ctx.getImageData(0,0,48,48).data;
      const bins={};
      for(let i=0;i<d.length;i+=4){const a=d[i+3];if(a<100)continue;const r=d[i],g=d[i+1],b=d[i+2];if(Math.max(r,g,b)>245&&Math.min(r,g,b)>220)continue;if(Math.max(r,g,b)-Math.min(r,g,b)<22&&r>100)continue;const key=[Math.round(r/24)*24,Math.round(g/24)*24,Math.round(b/24)*24].join(',');bins[key]=(bins[key]||0)+1}
      const best=Object.entries(bins).sort((a,b)=>b[1]-a[1])[0];if(best){const rgb=best[0].split(',').map(Number);setBrand('#'+rgb.map(hex).map(x=>x.slice(1)).join(''))}else setBrand('#1769e0');
    }catch(e){setBrand('#1769e0')}};
    img.onerror=()=>setBrand('#1769e0'); img.src=src;
  }

<script id="ss-user-notification-support-navigation-v1">
/* Extend the existing user notification centre without replacing its current staff/partner reminders. */
(function(){
  function install(){
    if(typeof window.ntNav!=='function' || window.__ssSupportNtNavInstalled) return;
    const original=window.ntNav;
    window.ntNav=function(ref){
      if(typeof ref==='string' && ref.indexOf('support:')===0){
        const ticketId=ref.slice(8);
        const pop=document.getElementById('ntp'); if(pop)pop.remove();
        if(typeof window.go==='function') window.go('support');
        // Wait for the async support view to render, then bring the matching ticket into view.
        window.setTimeout(()=>{
          const main=document.getElementById('main'); if(!main)return;
          const rows=Array.from(main.querySelectorAll('tr'));
          const row=rows.find(tr=>tr.dataset && tr.dataset.ticketId===ticketId) || rows.find(tr=>tr.textContent && tr.textContent.indexOf(ticketId)>=0);
          if(row){row.scrollIntoView({behavior:'smooth',block:'center'});row.style.outline='2px solid #f0ad4e';row.style.background='#fff8e8';}
        },650);
        return;
      }
      return original(ref);
    };
    window.__ssSupportNtNavInstalled=true;
  }
  install();
  document.addEventListener('DOMContentLoaded',install);
  window.setInterval(install,1500);
})();
</script>
